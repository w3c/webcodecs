name: Auto publish

on:
  # Workflow runs on pull requests where it makes sure that the modified specs
  # can still be generated, that markup is valid and that there are no broken
  # links, as well as on pushes to the default branch where it also deploys the
  # generated specs to the gh-pages branch and publishes the results to /TR.
  # The "workflow_dispatch" hook allows admins to also trigger the workflow
  # manually from GitHub's UI.
  pull_request:
    paths:
      - '*.src.html'
  push:
    branches: [main]
    paths:
      - '*.src.html'
      - '.github/workflows/auto-publish.yml'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec to publish ("stale" for out-of-date specs, "all", or a specific source file)'
        required: true
        default: 'stale'
        type: choice
        options:
          - stale
          - all
          - index.src.html
          - codec_registry.src.html
          - video_frame_metadata_registry.src.html
          - aac_codec_registration.src.html
          - alaw_codec_registration.src.html
          - av1_codec_registration.src.html
          - avc_codec_registration.src.html
          - flac_codec_registration.src.html
          - hevc_codec_registration.src.html
          - mp3_codec_registration.src.html
          - opus_codec_registration.src.html
          - pcm_codec_registration.src.html
          - ulaw_codec_registration.src.html
          - vorbis_codec_registration.src.html
          - vp8_codec_registration.src.html
          - vp9_codec_registration.src.html

jobs:
  detect-changes:
    name: Detect specs to publish
    runs-on: ubuntu-latest
    outputs:
      has_specs: ${{ steps.filter.outputs.has_specs }}
      specs: ${{ steps.filter.outputs.specs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Determine specs to build
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SPEC: ${{ inputs.spec }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import subprocess

          SPECS = [
              {
                  "source": "index.src.html",
                  "destination": "index.html",
                  "echidna_token": "ECHIDNA_TOKEN_WEBCODECS",
                  "publication_status": "WD",
              },
              {
                  "source": "codec_registry.src.html",
                  "destination": "codec_registry.html",
                  "echidna_token": "ECHIDNA_TOKEN_CODEC_REGISTRY",
                  "publication_status": "DRY",
              },
              {
                  "source": "avc_codec_registration.src.html",
                  "destination": "avc_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_AVC_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "vorbis_codec_registration.src.html",
                  "destination": "vorbis_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_VORBIS_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "mp3_codec_registration.src.html",
                  "destination": "mp3_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_MP3_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "aac_codec_registration.src.html",
                  "destination": "aac_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_AAC_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "flac_codec_registration.src.html",
                  "destination": "flac_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_FLAC_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "opus_codec_registration.src.html",
                  "destination": "opus_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_OPUS_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "av1_codec_registration.src.html",
                  "destination": "av1_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_AV1_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "vp9_codec_registration.src.html",
                  "destination": "vp9_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_VP9_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "vp8_codec_registration.src.html",
                  "destination": "vp8_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_VP8_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "pcm_codec_registration.src.html",
                  "destination": "pcm_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_PCM_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "alaw_codec_registration.src.html",
                  "destination": "alaw_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_ALAW_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "ulaw_codec_registration.src.html",
                  "destination": "ulaw_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_ULAW_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "hevc_codec_registration.src.html",
                  "destination": "hevc_codec_registration.html",
                  "echidna_token": "ECHIDNA_TOKEN_HEVC_REGISTRATION",
                  "publication_status": "NOTE-WD",
              },
              {
                  "source": "video_frame_metadata_registry.src.html",
                  "destination": "video_frame_metadata_registry.html",
                  "echidna_token": "ECHIDNA_TOKEN_VIDEOFRAMEMETADATA_REGISTRY",
                  "publication_status": "DRY",
              },
          ]

          def git_output(args):
              return subprocess.check_output(["git"] + args, text=True).strip()

          def is_stale_on_gh_pages(spec):
              try:
                  main_ts = int(git_output(["log", "-1", "--format=%ct", "HEAD", "--", spec["source"]]))
                  gh_ts = int(git_output(["log", "-1", "--format=%ct", "origin/gh-pages", "--", spec["destination"]]))
                  return main_ts > gh_ts
              except Exception:
                  return True

          def changed_files_for_pr(pr_base):
              # In GitHub Actions pull_request events, actions/checkout checks out
              # a merge commit where HEAD^1 is the base branch and HEAD^2 is the PR head.
              has_second_parent = subprocess.run(
                  ["git", "rev-parse", "--verify", "--quiet", "HEAD^2"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if has_second_parent:
                  out = git_output(["diff", "--name-only", "HEAD^1", "HEAD"])
              elif pr_base:
                  out = git_output(["diff", "--name-only", f"{pr_base}...HEAD"])
              else:
                  out = git_output(["diff", "--name-only", "HEAD~1", "HEAD"])
              return set(out.splitlines())

          def changed_files_between(base, head):
              try:
                  if not base or set(base) == {"0"}:
                      raise ValueError("empty base")
                  out = git_output(["diff", "--name-only", base, head])
              except Exception:
                  out = git_output(["diff", "--name-only", "HEAD~1", "HEAD"])
              return set(out.splitlines())

          event_name = os.environ.get("EVENT_NAME", "")
          input_spec = os.environ.get("INPUT_SPEC", "").strip()

          # Ensure origin/gh-pages ref is available for staleness checks on push/dispatch.
          if event_name in ("push", "workflow_dispatch"):
              subprocess.run(
                  ["git", "fetch", "--filter=blob:none", "origin", "gh-pages:refs/remotes/origin/gh-pages"],
                  check=False,
              )

          selected = []
          if event_name == "workflow_dispatch":
              if input_spec == "all":
                  selected = SPECS
              elif input_spec in ("stale", ""):
                  selected = [s for s in SPECS if is_stale_on_gh_pages(s)]
              else:
                  selected = [s for s in SPECS if s["source"] == input_spec]
          elif event_name == "pull_request":
              pr_base = os.environ.get("PR_BASE_SHA", "").strip()
              changed = changed_files_for_pr(pr_base)
              selected = [s for s in SPECS if s["source"] in changed]
          else:
              before = os.environ.get("BEFORE_SHA", "").strip()
              after = os.environ.get("AFTER_SHA", "HEAD").strip() or "HEAD"
              changed = changed_files_between(before, after)
              selected = [
                  s for s in SPECS
                  if s["source"] in changed or is_stale_on_gh_pages(s)
              ]

          print(f"Selected {len(selected)} spec(s): {[s['source'] for s in selected]}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_specs={'true' if selected else 'false'}\n")
              f.write(f"specs={json.dumps(selected)}\n")
          EOF

  main:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_specs == 'true' }}
    name: Auto publish (${{ matrix.source }})
    runs-on: ubuntu-latest
    # Serialize publications (max-parallel: 1) so multi-spec updates do not
    # race when pushing to the gh-pages branch (see w3c/spec-prod#58).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.specs) }}
    steps:
      # See doc at https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # See doc at https://w3c.github.io/spec-prod/
      # The action only deploys the generated spec to the gh-pages branch when
      # the workflow was triggered by a push to the default branch or
      # workflow_dispatch.
      - name: Build and validate spec, push to gh-pages branch and deploy to /TR if needed
        uses: w3c/spec-prod@v2
        with:
          TOOLCHAIN: bikeshed
          BUILD_FAIL_ON: warning
          SOURCE: ${{ matrix.source }}
          DESTINATION: ${{ matrix.destination }}
          GH_PAGES_BRANCH: gh-pages
          W3C_ECHIDNA_TOKEN: ${{ secrets[matrix.echidna_token] }}
          W3C_WG_DECISION_URL: https://github.com/w3c/media-wg/issues/27
          W3C_BUILD_OVERRIDE: |
            status: ${{ matrix.publication_status }}
